# Supabase configuration
project_id = "project-review-app"

[api]
enabled = true
schemas = ["public"]

[db]
port = 54322
shadow_port = 54320

[db.migrations]
schema_paths = [
  "./schemas/reviews.sql",
  "./schemas/functions.sql",
]

[db.seed]
enabled = true
sql_paths = [
  "./seeds/*.sql",
]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
jwt_expiry = 3600

[storage]
enabled = true
file_size_limit = "50MiB"